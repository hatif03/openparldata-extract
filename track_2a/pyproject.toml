[project]
name = "opd-extract"
version = "0.1.0"
description = "Parliamentary PDF to OpenParlData structure with Docling + Apertus 1.5 (Hack Apertus 2A)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
layout = ["docling>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
